version: "3.9"

services:
  # ---------- MySQL Database ----------
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d   # auto-run setup.sql on first start
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Data Pipeline ----------
  pipeline:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db        # override host to point to the Docker service name
    command: python pipeline.py

  # ---------- Streamlit Dashboard ----------
  dashboard:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "8501:8501"
    command: streamlit run dashboard.py --server.address 0.0.0.0

volumes:
  db_data:
